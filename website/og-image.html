<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>portguard OG image layout</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #0e161b; color: #e4ecef; font-family: "Instrument Sans", system-ui, sans-serif; display: grid; grid-template-columns: 1fr 400px; gap: 40px; padding: 64px 72px 56px; }
  .l { display: flex; flex-direction: column; }
  .brand { font: 700 34px/1 ui-monospace, Menlo, Consolas, monospace; color: #4cc3d3; }
  h1 { font-size: 72px; line-height: 1.02; letter-spacing: -0.03em; margin: 40px 0 0; font-weight: 700; }
  p { font-size: 27px; line-height: 1.4; color: #9fb0ba; margin: 28px 0 0; max-width: 560px; }
  .by { margin-top: auto; font-size: 19px; white-space: nowrap; color: #9fb0ba; }
  .r { background: #152129; border: 1px solid #27363f; border-radius: 16px; display: grid; place-items: center; }
  svg { width: 350px; height: auto; }
  text { font-family: "Instrument Sans", system-ui, sans-serif; fill: #e4ecef; font-size: 13px; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .muted { fill: #9fb0ba; }
</style>
</head>
<body>
<div class="l">
  <div class="brand">portguard</div>
  <h1>Close the ports ufw doesn't cover</h1>
  <p>A cron job that probes your listening TCP ports like a LAN machine would, and drops the ones that answer.</p>
  <div class="by">Built by Babak Bandpey · cocode.dk · linkedin.com/in/babakbandpey</div>
</div>
<div class="r">
  <svg viewBox="0 0 360 380" aria-hidden="true">
    <rect x="80" y="8" width="200" height="56" rx="8" fill="#0e161b" stroke="#e4ecef" stroke-width="1.5"/>
    <text x="180" y="30" text-anchor="middle">A machine on the LAN</text>
    <text class="code muted" x="180" y="50" text-anchor="middle">192.0.2.50</text>
    <g stroke="#e4ecef" stroke-width="3" stroke-linecap="round"><line x1="16" y1="190" x2="148" y2="190"/><line x1="212" y1="190" x2="344" y2="190"/></g>
    <text x="82" y="176" text-anchor="middle">ufw</text>
    <text class="muted" x="278" y="176" text-anchor="middle">7777 skips ufw</text>
    <line x1="180" y1="70" x2="180" y2="282" stroke="#4cc3d3" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity=".35"/>
    <polygon points="171,282 189,282 180,296" fill="#4cc3d3" opacity=".35"/>
    <rect x="144" y="184" width="72" height="12" rx="3" fill="#ff7a6b"/>
    <text class="code" x="180" y="222" text-anchor="middle" style="fill:#ff7a6b;font-weight:700">nft drop</text>
    <rect x="60" y="304" width="240" height="64" rx="8" fill="#0e161b" stroke="#e4ecef" stroke-width="1.5"/>
    <text x="180" y="328" text-anchor="middle">Docker container</text>
    <text class="code muted" x="180" y="350" text-anchor="middle">published port 7777</text>
  </svg>
</div>
</body>
</html>
