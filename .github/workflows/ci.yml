name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: shellcheck
        run: shellcheck -x portguard tests/run.sh scripts/install-hooks.sh .githooks/pre-commit .githooks/commit-msg .githooks/pre-push

      - name: tests
        run: tests/run.sh
