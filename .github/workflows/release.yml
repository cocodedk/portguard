name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Git tags are the version. Modes: new (bump the latest published tag), or recover (the latest
      # tag has no published release yet: finish it, never bump again). A planned tag that already
      # has a published release, or a stray tag, fails visibly.
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          mode=new
          if [ -n "$latest" ]; then
            draft=$(gh release view "$latest" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            [ "$draft" = false ] || mode=recover
          else
            latest=v0.0.0
          fi
          if [ "$mode" = recover ]; then
            tag=$latest
          else
            [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists but is not the latest SemVer tag; refusing to touch it"
              exit 1
            fi
          fi
          { echo "mode=$mode"; echo "tag=$tag"; echo "version=${tag#v}"; } >> "$GITHUB_OUTPUT"

      - name: Build from the tagged commit when recovering
        if: steps.plan.outputs.mode == 'recover'
        run: git checkout "refs/tags/${{ steps.plan.outputs.tag }}"

      - name: Test and shellcheck the source
        run: |
          shellcheck -x portguard tests/run.sh
          tests/run.sh

      # The stamp lives only in the runner: nothing is committed back.
      - name: Build assets
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          sed "s/^VERSION=[^ ]*/VERSION=$VERSION/" portguard > dist/portguard
          cp portguard.cron dist/portguard.cron
          chmod 0755 dist/portguard
          bash -n dist/portguard
          [ "$(bash -c 'source dist/portguard; printf %s "$VERSION"')" = "$VERSION" ]
          (cd dist && sha256sum portguard portguard.cron > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/portguard
            dist/portguard.cron
            dist/SHA256SUMS

      - name: Tag
        if: steps.plan.outputs.mode == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.plan.outputs.tag }}"
          git push origin "refs/tags/${{ steps.plan.outputs.tag }}"

      - name: Draft, upload, verify, publish
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/portguard dist/portguard.cron dist/SHA256SUMS --clobber
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(" ")')
          [ "$assets" = "SHA256SUMS portguard portguard.cron" ] || { echo "::error::incomplete assets: $assets"; exit 1; }
          gh release edit "$tag" --draft=false
